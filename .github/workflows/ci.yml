name: ci
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Configure read-only PEGE dependency key
        env:
          PEGE_DEPLOY_KEY: ${{ secrets.PEGE_DEPLOY_KEY }}
        run: |
          test -n "${PEGE_DEPLOY_KEY}"
          install -m 700 -d ~/.ssh
          printf '%s\n' "${PEGE_DEPLOY_KEY}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan github.com >> ~/.ssh/known_hosts
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
# Never download or convert EDSM dumps here. Operators run `npm run convert` on their own machine.
